name: Research or reproduction issue
description: Record evidence, commands, and effects on the research.
body:
  - type: input
    id: revision
    attributes:
      label: Commit and experiment identifier
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and steps to reproduce
      description: Include the environment, relevant code or artifact, exact commands, and observed output.
    validations:
      required: true
  - type: textarea
    id: consequence
    attributes:
      label: Expected result and research consequence
