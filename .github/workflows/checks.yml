name: ECHO verification
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Publish this verified commit to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.14.0
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run reference
      - run: npm run verify
      - run: python scripts/reference_echo2.py
      - run: node scripts/echo2.mjs verify
      - run: npm run build
      - name: Install browser QA tooling
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.65.1
          npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
        with:
          path: dist

  pages:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static bundle
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
