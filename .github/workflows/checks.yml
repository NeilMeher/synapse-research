name: SYNAPSE verification
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Publish this verified commit to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.14.0
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run reference
      - run: npm run verify
      - run: python scripts/reference_echo2.py
      - run: node scripts/echo2.mjs verify
      - run: python scripts/reference_mirage.py
      - run: node scripts/mirage.mjs verify
      - run: python scripts/reference_reflex.py
      - run: node scripts/reflex.mjs verify
      - run: python scripts/reference_convergence.py
      - run: node scripts/convergence.mjs verify
      - run: python scripts/reference_morpheus.py
      - run: node scripts/morpheus.mjs verify
      - run: python scripts/reference_alpha_decay.py
      - run: node scripts/alpha-decay.mjs verify
      - run: python -B scripts/reference_noesis.py
      - run: node scripts/noesis.mjs verify
      - run: python -B scripts/reference_scientia.py
      - run: node scripts/scientia.mjs verify
      - run: python -B scripts/reference_episteme.py
      - run: node scripts/episteme.mjs verify
      - run: python -B scripts/reference_axiom.py
      - run: node scripts/axiom.mjs verify
      - run: python -B scripts/reference_civilizations.py
      - run: node scripts/civilizations.mjs verify
      - run: python -B scripts/check_polis_reference.py
      - run: node scripts/polis.mjs verify
      - run: python -B scripts/reference_polis2.py
      - run: node scripts/polis2.mjs verify
      - run: python -B scripts/check_artha_reference.py
      - run: python -B scripts/test_extract_artha.py
      - run: node scripts/artha.mjs verify
      - run: python -B scripts/check_energia_reference.py
      - run: node scripts/energia.mjs verify
      - run: python -B scripts/reference_nexus.py
      - run: node scripts/nexus.mjs verify
      - run: python -B scripts/extract_chronos.py --check
      - run: python -B scripts/test_chronos_sources.py
      - run: python -B scripts/reference_chronos.py
      - run: node scripts/chronos.mjs verify
      - run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - run: python -B scripts/check_schemas.py
      - run: python -B -m unittest empirical.test_empirical
      - run: python -B -m empirical.archive verify
      - run: python -B -m empirical.reference
      - run: python -B -m unittest empirical.robustness.test_robustness
      - run: python -B -m empirical.robustness.audit
      - run: python -B -m empirical.robustness.archive verify --split development
      - run: python -B -m empirical.robustness.archive verify --split heldout
      - run: python -B -m empirical.robustness.reference
      - run: python -B -m unittest empirical.phase3.test_phase3
      - run: python -B -m empirical.phase3.archive verify development
      - run: python -B -m empirical.phase3.archive verify decoding
      - run: python -B -m empirical.phase3.reference
      - run: python -B -m empirical.phase3.device_probe --verify
      - run: python -B -m empirical.qwen.core verify qwen-development
      - run: python -B -m empirical.qwen.reference
      - run: node empirical/echo-public/run.mjs verify
      - run: python -B empirical/echo-public/reference.py
      - run: node empirical/echo-hindi/run.mjs verify
      - run: python -B empirical/echo-hindi/reference.py
      - run: python -B research/echo-moments/reference.py
      - run: node research/morpheus-trust/run.mjs verify
      - run: python -B research/morpheus-trust/reference.py
      - run: python -B research/mirage-measurement/replay.py verify
      - run: python -B research/adaptive-trust/reference.py verify
      - run: node research/adaptive-trust/development.mjs verify
      - run: python -B research/adaptive-trust/development-reference.py
      - run: python -B research/axiom-trust-fixture.py verify
      - run: node research/morpheus-confirmatory/run.mjs verify
      - run: python -B research/morpheus-confirmatory/reference.py
      - run: python -B research/axiom-strategic/run.py verify
      - run: python -B research/belief-dynamics/reference.py verify
      - run: npm run build
      - name: Install browser QA tooling
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.65.1
          npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
        with:
          path: dist

  pages:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static bundle
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
